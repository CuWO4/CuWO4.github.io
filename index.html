<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuWO4 · Repositories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div id="author-card" class="author-card">
        <a id="author-link" class="author-main" target="_blank" rel="noopener noreferrer">
          <div class="author-top">
            <img id="author-avatar" class="author-avatar" alt="avatar">
            <div class="author-info">
              <span id="author-name" class="author-name"></span>
              <span id="author-bio" class="author-bio"></span>
              <span id="author-email" class="author-email"></span>
            </div>
          </div>
          <img id="contribution-graph" class="contribution-graph"
               src="data/contributions.svg" alt="contribution graph" loading="lazy">
        </a>
      </div>
      <p class="last-updated" id="last-updated"></p>
    </div>
  </header>
  <main class="container">
    <div class="repo-grid" id="repo-grid"></div>
    <p class="empty-state" id="empty-state" hidden>
      No repository data yet. The build will populate this page automatically.
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
